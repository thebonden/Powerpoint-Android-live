name: Windows build and tests
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  vsto:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build VSTO manifests and run Windows tests
        shell: pwsh
        run: ./scripts/build.ps1 -Configuration Release
      - name: Package setup.exe and matching source
        shell: pwsh
        run: ./scripts/package.ps1 -SkipBuild
      - name: Upload installation package
        uses: actions/upload-artifact@v4
        with:
          name: Android-Live-0.0.107-installation
          path: |
            artifacts/Android-Live-0.0.107-IT.zip
            artifacts/Android-Live-0.0.107-IT.zip.sha256
            artifacts/Android-Live-0.0.107-Setup.exe
            artifacts/Android-Live-0.0.107-Setup.exe.sha256
            artifacts/Android-Live-0.0.107-installation.zip

            artifacts/Android-Live-0.0.107-installation.zip.sha256
          if-no-files-found: error
          retention-days: 90
      - name: Upload development build (no signing key)
        uses: actions/upload-artifact@v4
        with:
          name: Android-Live-0.0.107-development
          path: src/AndroidLive/bin/Release/
          if-no-files-found: error
          retention-days: 14
      - name: Upload matching source and license notices
        uses: actions/upload-artifact@v4
        with:
          name: Android-Live-0.0.107-source
          path: |
            native/WifiQr/
            scripts/build-wifi-helper.ps1
          if-no-files-found: error
          retention-days: 14
